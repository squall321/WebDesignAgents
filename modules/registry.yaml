    props: "엔진 props({localTime, progress, dur, index, count, scene}) + data(schema.json) + theme(토큰 트리)"
    in_scope_hint: "세로 숏폼(9:16) 근거 제시 — 수치 하나 + 근거 한 줄 (증감 필 선택)"
