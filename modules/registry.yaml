# 모듈 레지스트리 인덱스 — 전 모듈(id·타입·경로·상태·요약). 상세 SSOT 는 각 module.yaml.
version: 1
updated: "2026-07-25"
load_order_contract:
  - web/runtime/animations-v2.jsx
  - web/tokens/loader.jsx
  - web/templates/omx-metaphors.jsx
  - web/templates/omx-templates.jsx
  - web/templates/omx-templates-ext.jsx
  - web/templates/omx-templates-data.jsx       # 창작 모드 위젯 수용 3종 (tpl.d-matrix/d-media/d-multi)
  - web/templates/omx-templates-vertical.jsx   # 세로 포맷(short-9x16) 전용 — 가로 자산과 이름 충돌 없음
  - "<project scenes.jsx>"
modules:
  - id: tpl.opening
    type: scene-template
    path: modules/scene-templates/opening
    status: draft
    version: 1.0.0
    nat_default: 8
    summary: "배지·대형 타이틀·서브타이틀·도트 라인이 순차 등장하는 오프닝 각인 씬"
    props: "엔진 props({localTime, progress, dur, index, count, scene}) + data(schema.json) + theme(토큰 트리)"
    in_scope_hint: "제품/플랫폼 소개 영상의 오프닝 각인 (배지 + 타이틀 + 서브타이틀)"
  - id: tpl.problem
    type: scene-template
    path: modules/scene-templates/problem
    status: draft
    version: 1.0.0
    nat_default: 13
    summary: "챗봇 목업(스켈레톤 답변)과 ✕ 실패 목록으로 기존 방식의 한계를 보여주는 문제 인식 씬"
    props: "엔진 props({localTime, progress, dur, index, count, scene}) + data(schema.json) + theme(토큰 트리)"
    in_scope_hint: "단일 도구/기존 방식의 한계 제시 (좌: 목업, 우: 주장 + ✕ 목록)"
  - id: tpl.concept
    type: scene-template
    path: modules/scene-templates/concept
    status: draft
    version: 1.0.0
    nat_default: 11
    summary: "중앙 질문에서 전문가 노드로 뻗는 방사형 네트워크와 라운드 목록으로 접근 방식을 설명하는 개념 씬"
    props: "엔진 props({localTime, progress, dur, index, count, scene}) + data(schema.json) + theme(토큰 트리)"
    in_scope_hint: "중앙 개념 → 4~8개 노드 방사형 네트워크"
  - id: tpl.process
    type: scene-template
    path: modules/scene-templates/process
    status: draft
    version: 1.0.0
    nat_default: 18
    summary: "진행 레일과 함께 3~6개 스텝 카드가 순차 점등되며 절차를 설명하는 씬"
    props: "엔진 props({localTime, progress, dur, index, count, scene}) + data(schema.json) + theme(토큰 트리)"
    in_scope_hint: "3~6단계 절차/파이프라인의 순서 설명 (점등 순서 = 절차 순서)"
  - id: tpl.differentiator
    type: scene-template
    path: modules/scene-templates/differentiator
    status: draft
    version: 1.0.0
    nat_default: 13
    summary: "R1→R2 반박 카드 흐름이 체크마크 수렴 카드로 착지하며 자체 교정을 보여주는 차별점 씬"
    props: "엔진 props({localTime, progress, dur, index, count, scene}) + data(schema.json) + theme(토큰 트리)"
    in_scope_hint: "오류 → 반박 → 수렴의 인과를 등장 순서로 연출 (flow 1~2장 + 수렴 1장)"
  - id: tpl.proof
    type: scene-template
    path: modules/scene-templates/proof
    status: draft
    version: 1.0.0
    nat_default: 15
    summary: "구체 식별자(보고서 번호 등)가 담긴 사례 카드 2~3장이 순차 등장하며 신뢰를 쌓는 실증 씬"
    props: "엔진 props({localTime, progress, dur, index, count, scene}) + data(schema.json) + theme(토큰 트리)"
    in_scope_hint: "실증 사례 2~3건 카드 나열 (식별자 + 메타 + 제목 + 설명 + 배지)"
  - id: tpl.closing
    type: scene-template
    path: modules/scene-templates/closing
    status: draft
    version: 1.0.0
    nat_default: 12
    summary: "통계 트리오가 페이드아웃한 뒤 타이틀과 CTA 필로 행동을 유도하는 2페이즈 클로징 씬"
    props: "엔진 props({localTime, progress, dur, index, count, scene}) + data(schema.json) + theme(토큰 트리)"
    in_scope_hint: "가치 통계 2~3개 → 타이틀 → CTA 1~3개의 2페이즈 마무리"
  - id: tpl.dataviz
    type: scene-template
    path: modules/scene-templates/dataviz
    status: draft
    version: 1.0.0
    nat_default: 13
    summary: "축→비교군→강조 막대→결론의 등장 순서로 수치 주장을 서사하는 가로 막대 논증 씬 (0 기준선·비례 정확을 스키마로 강제)"
    props: "엔진 props({localTime, progress, dur, index, count, scene}) + data(schema.json) + theme(토큰 트리)"
    in_scope_hint: "항목 2~5개 가로 막대 수치 논증 (강조 막대 1개 + 헤드라인 수치 + 결론 상자)"
  - id: tpl.timeline
    type: scene-template
    path: modules/scene-templates/timeline
    status: draft
    version: 1.0.0
    nat_default: 14
    summary: "좌→우 시간 레일 위 마일스톤이 순차 점등되고 완료 구간이 채워지며 현재선이 꽂히는 로드맵 씬 (과거 실적→현재→계획 서사)"
    props: "엔진 props({localTime, progress, dur, index, count, scene}) + data(schema.json) + theme(토큰 트리)"
    in_scope_hint: "마일스톤 3~6개 로드맵 (완료/진행 중/예정 3태, current 정확히 1개)"
  - id: tpl.compare
    type: scene-template
    path: modules/scene-templates/compare
    status: draft
    version: 1.0.0
    nat_default: 13
    summary: "AS-IS/TO-BE 를 행 단위로 짝지어 순차 대비하고 하단 결론 배지로 수렴하는 좌우 대칭 씬"
    props: "엔진 props({localTime, progress, dur, index, count, scene}) + data(schema.json) + theme(토큰 트리)"
    in_scope_hint: "좌우 2패널 행 2~4개 짝 비교 (쟁점 칩 + A/B 셀 + 결론 배지)"
  - id: tpl.d-matrix
    type: scene-template
    path: modules/scene-templates/d-matrix
    status: draft
    version: 1.0.0
    formats: [wide-16x9]
    stage: { w: 1920, h: 1080 }
    nat_default: 12
    summary: "헤더 행이 먼저 서고 데이터 행이 위→아래(행 안은 좌→우 스윕)로 등장하는 격자 표 씬 — 열≤8·행≤8 을 스키마가 강제하고 초과분은 '외 N행' 으로 정직하게 표기"
    props: "엔진 props({localTime, progress, dur, index, count, scene}) + data(schema.json) + theme(토큰 트리)"
    in_scope_hint: "3~8열 × 2~8행 격자 표 (raci_matrix·table·fmea 발췌 — 코드값은 칩, 초과분은 외 N행)"
  - id: tpl.d-media
    type: scene-template
    path: modules/scene-templates/d-media
    status: draft
    version: 1.0.0
    formats: [wide-16x9]
    stage: { w: 1920, h: 1080 }
    nat_default: 10
    summary: "이미지 카드가 스케일+페이드로 순차 등장하는 도판 씬 — 1장=전면·2장=대비·3장=그리드, 종횡비는 cover 로 보존(레터박스 금지)하고 캡션·출처를 하단 스트립에 표기"
    props: "엔진 props({localTime, progress, dur, index, count, scene}) + data(schema.json) + theme(토큰 트리)"
    in_scope_hint: "이미지/포스터 1~3장 쇼케이스 (image·video·cad_3d — 캡션·출처·매체 배지)"
  - id: tpl.d-multi
    type: scene-template
    path: modules/scene-templates/d-multi
    status: draft
    version: 1.0.0
    formats: [wide-16x9]
    stage: { w: 1920, h: 1080 }
    nat_default: 13
    summary: "축→항목→계열 순차 입장(범례 점등 → 막대 좌→우 스윕 → 계열 최대치 라벨)의 그룹 막대 논증 씬 — 0 기준선·비례 정확을 스키마로 강제, 값 라벨은 계열 최대치만 표기해 과밀 방지"
    props: "엔진 props({localTime, progress, dur, index, count, scene}) + data(schema.json) + theme(토큰 트리)"
    in_scope_hint: "2~4계열 × 3~7항목 그룹 막대 (chart 다계열·radar·progress_bar 다계열)"
  - id: vtpl.hook
    type: scene-template
    path: modules/scene-templates/v-hook
    status: draft
    version: 1.0.0
    formats: [short-9x16]
    stage: { w: 1080, h: 1920 }
    nat_default: 6
    summary: "상단 1/3 초대형 후킹 문구·중앙 파문 위 키워드 블록·하단 구간 예고 레일로 스크롤을 3초 안에 멈추는 세로 오프닝 씬"
    props: "엔진 props({localTime, progress, dur, index, count, scene}) + data(schema.json) + theme(토큰 트리)"
    in_scope_hint: "세로 숏폼(9:16) 첫 씬 — 3초 각인 후킹 + 남은 구간 예고"
  - id: vtpl.stack
    type: scene-template
    path: modules/scene-templates/v-stack
    status: draft
    version: 1.0.0
    formats: [short-9x16]
    stage: { w: 1080, h: 1920 }
    nat_default: 12
    summary: "새 카드가 하단으로 들어오면 앞선 카드가 그만큼 위로 밀리는 세로 스크롤 은유로 논지를 쌓는 씬 (tone 으로 문제/해법 양용)"
    props: "엔진 props({localTime, progress, dur, index, count, scene}) + data(schema.json) + theme(토큰 트리)"
    in_scope_hint: "세로 숏폼(9:16) 문제/해법 제시 — 논지 카드 3~4장 적층 + 결론 필"
  - id: vtpl.metric
    type: scene-template
    path: modules/scene-templates/v-metric
    status: draft
    version: 1.0.0
    formats: [short-9x16]
    stage: { w: 1080, h: 1920 }
    nat_default: 10
    summary: "화면 중앙 절반(470~1350)을 후광과 초대형 수치가 차지하고 그 아래 근거 한 줄이 받치는 모바일 가독 우선 수치 씬"
    props: "엔진 props({localTime, progress, dur, index, count, scene}) + data(schema.json) + theme(토큰 트리)"
    in_scope_hint: "세로 숏폼(9:16) 근거 제시 — 수치 하나 + 근거 한 줄 (증감 필 선택)"
  - id: vtpl.cta
    type: scene-template
    path: modules/scene-templates/v-cta
    status: draft
    version: 1.0.0
    formats: [short-9x16]
    stage: { w: 1080, h: 1920 }
    nat_default: 8
    summary: "룰→대형 문구→보조 줄 순으로 착지한 뒤 전폭 진입점 필이 엄지 도달 구역에 세로로 쌓이는 마무리 씬"
    props: "엔진 props({localTime, progress, dur, index, count, scene}) + data(schema.json) + theme(토큰 트리)"
    in_scope_hint: "세로 숏폼(9:16) 마지막 씬 — 대형 문구 + 진입점 필 1~3개"
  - id: mtp.frame-chrome
    type: metaphor
    path: "web/templates/omx-metaphors.jsx#FrameChrome"
    export: "window.OMX.metaphors['frame-chrome']"
    status: draft
    version: 1.0.0
    summary: "씬 공통 크롬 — 킥커/타이틀/푸터/도트 그리드 셸"
  - id: mtp.dot-grid
    type: metaphor
    path: "web/templates/omx-metaphors.jsx#DotGrid"
    export: "window.OMX.metaphors['dot-grid']"
    status: draft
    version: 1.0.0
    summary: "움직이는 점 텍스처 배경"
  - id: mtp.chatbot-mockup
    type: metaphor
    path: "web/templates/omx-metaphors.jsx#ChatbotMockup"
    export: "window.OMX.metaphors['chatbot-mockup']"
    status: draft
    version: 1.0.0
    summary: "챗봇 목업 + 스켈레톤 답변 + 판정 필"
  - id: mtp.radial-network
    type: metaphor
    path: "web/templates/omx-metaphors.jsx#RadialNetwork"
    export: "window.OMX.metaphors['radial-network']"
    status: draft
    version: 1.0.0
    summary: "중앙 개념 → 방사형 노드 네트워크"
  - id: mtp.step-card-grid
    type: metaphor
    path: "web/templates/omx-metaphors.jsx#StepCardGrid"
    export: "window.OMX.metaphors['step-card-grid']"
    status: draft
    version: 1.0.0
    summary: "순차 점등 스텝 카드 그리드 + 진행 레일"
  - id: mtp.rebuttal-flow
    type: metaphor
    path: "web/templates/omx-metaphors.jsx#RebuttalFlow"
    export: "window.OMX.metaphors['rebuttal-flow']"
    status: draft
    version: 1.0.0
    summary: "R1→R2 반박 카드 흐름 + 화살표"
  - id: mtp.checkmark-converge
    type: metaphor
    path: "web/templates/omx-metaphors.jsx#CheckmarkConverge"
    export: "window.OMX.metaphors['checkmark-converge']"
    status: draft
    version: 1.0.0
    summary: "아바타 체크마크 순차 점등 수렴 카드"
  - id: mtp.stat-trio
    type: metaphor
    path: "web/templates/omx-metaphors.jsx#StatTrio"
    export: "window.OMX.metaphors['stat-trio']"
    status: draft
    version: 1.0.0
    summary: "대형 통계 가로 나열 (+선택적 퇴장)"
  - id: mtp.cta-pill
    type: metaphor
    path: "web/templates/omx-metaphors.jsx#CtaPill"
    export: "window.OMX.metaphors['cta-pill']"
    status: draft
    version: 1.0.0
    summary: "행동유도 필 (정적 — 모션은 부모 소관)"
  - id: theme.hwax-blue
    type: theme
    path: web/tokens/hwax-blue.json
    status: draft
    version: 1.0.0
    summary: "HWAX Blue 기본 테마 — raw 16색/폰트/그림자, 시맨틱 타입·좌표·모션·contrastPairs, 컴포넌트 별칭"
