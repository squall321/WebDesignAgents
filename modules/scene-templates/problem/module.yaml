# tpl.problem — 씬 템플릿 모듈 SSOT (문제 — 챗봇 목업 + ✕ 실패 목록)
id: tpl.problem
type: scene-template
name: "문제 — 챗봇 목업 + ✕ 실패 목록"
status: draft
version: 1.0.0
engine_compat: "animations-v2"
origin: "examples/hwax_intro/hwax-scenes.jsx#S2Problem"
