out_of_scope:
  - "두 문장 이상·불릿 (한 문장이 아니면 tpl.l-split)"
  - "수치 각인 (tpl.dataviz·tpl.closing 소관)"
  - "타이틀 병기 — 문장 자체가 타이틀이라 title 필드를 두지 않는다"
