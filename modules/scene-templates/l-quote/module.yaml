composition: "무대 52% 지점을 기준으로 세로 중앙 정렬 — (선택) 청색 룰 120px → 문장(폭 1400px, 30자 이하 80px · 48자 이하 70px · 그 위 60px, 최대 3행) → 룰 90px → 화자(36px 청색) → 직함(26px 보조) — 은유: 각인"
