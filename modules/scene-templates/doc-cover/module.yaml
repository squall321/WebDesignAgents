# tpl.doc-cover — 문서형 씬 템플릿 모듈 SSOT (문서형 표지 — 제목·부제·작성일·출처·로고 자리)
id: tpl.doc-cover
type: scene-template
name: "문서형 표지 — 제목·부제·작성일·출처·로고 자리"
status: draft
version: 1.0.0
engine_compat: "animations-v2"
origin: "창작 모드 문서형 2026-07-29"
formats: [deck-doc-16x9, deck-4x3, print-a4]
# stage = 골든 스냅샷·재현력 검증의 기준 무대(deck-doc-16x9). 나머지 두 무대는 stages 에 명시하고
# 레이아웃은 좌표가 아니라 flex 비율이라 같은 코드가 셋 다 성립한다(실측: tests/test_templates_doc_render.py).
stage: { w: 1920, h: 1080 }
stages:
  deck-doc-16x9: { w: 1920, h: 1080 }
  deck-4x3: { w: 1440, h: 1080 }
  print-a4: { w: 1240, h: 1754 }
nat_default: 6
scene_name_default: "표지"
entry:
  template: "web/templates/omx-templates-doc.jsx#DocCoverScene"
  schema: schema.json
  fixtures:
    - fixtures/min.json
    - fixtures/typical.json
    - fixtures/max.json
  preview: preview.html
  snapshots: fixtures/snapshots/
metaphors:
  - doc-page
  - doc-rule
theme_default: hwax-blue
summary: "상단 워드마크·문서 종류 배지, 중앙 제목·부제, 하단 메타 2열(작성일·출처 보고서·작성 조직)로 구성된 문서형 표지"
composition: "세로 space-between 3단 — 상단 로고 40px 마크 + 워드마크 30px / 배지 필, 중앙 룰 132px + 제목 62px + 부제 28px, 하단 구분선 + 메타 2열 그리드(라벨 24px · 값 26px) + 각주 24px"
in_scope:
  - "문서형 덱·인쇄물의 첫 장"
  - "작성일·출처 보고서·작성 조직 등 메타 2~5행"
  - "로고 자리(워드마크 텍스트)"
out_of_scope:
  - "영상 오프닝 각인 (tpl.opening 사용 — 저 쪽은 모션이 논리다)"
  - "이미지 로고·배경 사진 (현재 워드마크 텍스트만)"
  - "목차 겸용 표지 (tpl.doc-toc 로 분리)"
quality:
  gates_passed: []
  reviews: []
