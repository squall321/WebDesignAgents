<!DOCTYPE html>
<!-- tpl.doc-body 단독 구동 프리뷰 (문서형) — 무대는 ?stage=16x9|4x3|a4 로 갈아끼운다(기본 deck-doc-16x9 1920×1080). 로드 순서: 엔진 → 토큰 로더 → 문서형 템플릿 → 씬 -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tpl.doc-body preview — 본문 (문서형 3무대)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>html, body { margin: 0; padding: 0; height: 100%; background: #E9EBF1; }</style>
<script>window.OM_SCENES = '[{"name":"본문","dur":9}]';</script>
<script>window.OM_PLAYBACK = '{"mode":"loop"}';</script>
<script src="../../../web/vendor/react.production.min.js"></script>
<script src="../../../web/vendor/react-dom.production.min.js"></script>
<script src="../../../web/vendor/babel.min.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react" src="../../../web/runtime/animations-v2.jsx"></script>
<script type="text/babel" data-presets="react" src="../../../web/tokens/loader.jsx"></script>
<script type="text/babel" data-presets="react" src="../../../web/templates/omx-templates-doc.jsx"></script>
<script type="text/babel" data-presets="react">
// 문서형 프리뷰 — tpl.doc-body 에 fixture 를 바인딩해 단독 구동
// (babel 전역 스크립트라 엔진 최상위 선언과 충돌하지 않도록 비충돌 이름으로 참조)
// ?fixture=min|typical|max|... 로 픽스처 교체, ?stage=16x9|4x3|a4 로 무대 교체 (기본 typical / 16x9)
const SceneRoot = window.SceneStage;
const docQuery = new URLSearchParams(location.search);
const fixtureName = (docQuery.get('fixture') || 'typical').replace(/[^a-z]/g, '') || 'typical';
const stageKey = (docQuery.get('stage') || '16x9').replace(/[^a-z0-9]/g, '') || '16x9';
const stageMap = { '16x9': 'deck-doc-16x9', '4x3': 'deck-4x3', a4: 'print-a4' };
const formatId = stageMap[stageKey] || 'deck-doc-16x9';
const stage = window.OMX.doc.stages[formatId];
const theme = window.OMX.themes.loadUrl('../../../web/tokens/hwax-blue.json');
const data = window.OMX.io.loadJson('./fixtures/' + fixtureName + '.json');
const Tpl = window.OMX.templateIndex['tpl.doc-body'];
function BoundScene(props) { return <Tpl {...props} data={data} theme={theme} />; }
function TplPreview() {
  return (
    <div style={{ position: 'relative', width: '100vw', height: '100vh', overflow: 'hidden' }}>
      <SceneRoot width={stage.w} height={stage.h} bg={theme.color.bg}
                 scenes={window.OM_SCENES} playback={window.OM_PLAYBACK}>
        {{ '본문': BoundScene }}
      </SceneRoot>
    </div>
  );
}
window.TplPreview = TplPreview;
window.__OMX_PREVIEW__ = {
  tpl: 'tpl.doc-body',
  fixture: fixtureName,
  format: formatId,
  stage: stage,
  nat: Tpl.nat,
  still: window.OMX.doc.stillOf(Tpl.schedule(data), Tpl.nat),
};
ReactDOM.createRoot(document.getElementById('root')).render(<TplPreview />);
</script>
</body>
</html>
