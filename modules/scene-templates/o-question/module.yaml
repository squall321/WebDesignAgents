  - "질문이 아니라 결론을 먼저 던지는 오프닝 (tpl.o-statement / tpl.o-metric)"
  - "중앙 빈 자리에 도판·수치를 채우는 변형 (빈 자리가 이 템플릿의 존재 이유)"
