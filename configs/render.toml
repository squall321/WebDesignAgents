# 렌더/export 파이프라인 기본 설정 (src/wdrender/config.py 가 로드)

[video]
fps = 24
# width/height 는 **포맷 미지정 시의 폴백**이다. 무대 크기의 정본은 formats/{id}/format.yaml
# 의 stage 이며, export_video/export_pptx 에 format_id 를 주면 그 값이 여기를 덮어쓴다.
width = 1920
height = 1080
viewport_margin = 60   # 스테이지 크기 대비 뷰포트 여유(px) — 자동 축소(scale<1) 방지

[ffmpeg]
# 프레임 PNG 시퀀스 → mp4 조립 시 -framerate/-i 뒤에 붙는 출력 인자
args = ["-c:v", "libx264", "-pix_fmt", "yuv420p"]

[pptx]
default_still_progress = 0.9   # stills 미지정 씬의 기본 캡처 시점 (씬 progress 비율)

[vendor]
dir = "web/vendor"   # window.__resources 폴백 주입에 쓸 React/Babel 로컬 사본 (repo 루트 기준)
