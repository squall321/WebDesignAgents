lessons:
  - "조각 추출은 결백했다 — 유실은 전부 scenario_build 에서 났다. 장르 문제를 ingest 에서 찾지 마라"
  - "템플릿이 있어도 _BUILDERS 에 없으면 그 템플릿은 존재하지 않는다 — o-question·o-statement·o-metric·x-next·x-quote·x-summary 6종이 그 상태로 등록만 돼 있었다"
  - "담당·시점이 원문에 없으면 '미지정'·'후속' 로 드러낸다 — 지어내면 심의 결과가 아니라 창작이 된다"
  # ── format_review(2026-11-01, 6인 20턴, Go) 확정 교훈 ──
  - "이 장르의 골든은 무음이다 — 내레이션은 scenario.json 에서 파생되므로 대본은 재현되지만 음성 실측 기준은 없다. 내레이션 켠 산출을 골든과 비교하려 하지 마라(외부 TTS 를 회귀선에 넣지 않기로 했다)"
  - "copy_guide·dur_plan 은 TTS 실측 전이라 비워 둔다 — 빈 칸은 '상한이 없다' 가 아니라 '아직 재지 않았다' 다. 추정치를 적으면 다음 사람이 그것을 실측으로 알고 집필한다 (2026-11-07 실측으로 채웠다)"
  # ── TTS 실측(2026-11-07) 이 낳은 교훈 ──
  - "나레이션 예산 상수 rate 5.5 는 **합계로는 믿을 만하고 씬별로는 아니다** — 실측 대비 합계 오차 -2.3%(67.3s 추정 / 65.75s 실측)인데 씬별로는 각인 -24%·개념 +14% 로 벌어진다. 총 길이 가늠에는 쓰고 씬 배분에는 쓰지 마라"
  - "nat_default 의 합은 길이의 근거가 아니다 — 64초는 '아직 안 쟀다' 가 아니라 **모자랐다**. 6씬 중 4씬이 낭독을 못 담았고 실측 재조정으로 72.3초가 됐다. 새 장르의 첫 target 은 추정이며 실측 전까지 그렇게 다뤄라"
  - "내용량과 길이가 어긋난 자리는 실측이 드러낸다 — 결정 씬은 2.37초가 남고(결정문 한 문장) 액션 씬은 4초가 모자랐다(담당·시점까지 읽는다). 씬 길이는 템플릿 기본값이 아니라 그 씬이 말할 양이 정한다"
  - "빌드는 토큰을 복사한다(산출물 자기완결성) — 토큰 선언을 고쳤으면 재빌드해야 게이트가 새 선언으로 판정한다. 고치고 게이트만 다시 돌리면 옛 복사본을 읽는다"
  - "쟁점 슬롯 70자를 넘기면 말줄임이 아니라 오독이 된다 — 득실은 'A 하면 B 지만 C 다' 꼴이라 뒷절반이 핵심이고, 잘리면 문장이 반대 뜻이 된다"
  - "이 장르는 화면만으로 읽혀야 한다 — 시청 맥락이 혼자 보는 자료라 소리를 못 켜는 경우가 흔하다. 내레이션은 보조이지 전제가 아니다"
  - "결정문을 두 씬에 넣지 마라 — 결정 씬은 선언(한 문장), 액션 씬은 근거와 이행이다. tpl.o-statement 의 3행×18자는 96px 역산값이라 근거를 더 넣을 자리가 아니다"
  - "쟁점 역할은 빌더 수정으로 대체되지 않는다 — 득실 문장은 질문 슬롯(1~2행×18자)에 들어갈 자리가 없다. 제작 심의에서 ST 가 유보했고 AU 가 자수 계산으로 반박했으며, 2회차 실측에서 AU 가 옳았다"
  - "포맷 승격 심의가 다른 포맷이 통과시킨 결함을 함께 닫을 수 있다 — 이번에 선언한 미선언 색 조합은 active 인 wide-16x9 의 골든에도 있던 것이다. 공유 자산(템플릿·테마)의 결함은 어느 심의에서든 잡힌다"

# ── 미해결 쟁점 (format_review 2026-11-01 보존) ──
# O-2 근거의 자리 — 비참여자에게는 결정보다 근거가 중요한데, 근거는 액션 씬 좌측 패널의
#     26자 points 다. 쟁점 역할 신설로 득실은 자리를 얻었으나 근거는 못 얻었다. 답이
#     없으므로 교훈이 아니라 미해결로 둔다.
# O-4 총 길이 — 64초도 템플릿 nat_default 의 합일 뿐 실측이 아니다. 시청 맥락이 정해졌으니
#     이제 정할 수 있다. 3회차 또는 TTS 실측 때 확정한다.
