# delib-16x9 — 심의 결과 브리핑 포맷. 포털(hwax-deliberation) 심의가 낳은 보고서를
# 그대로 받아 화두→라운드→결정→액션→요약으로 세운다.
#
# 왜 별도 포맷인가 — wide-16x9 의 골격은 제품 소개용 설득 골격(문제→개념→절차→차별점→실증)
# 이다. 심의문을 거기 끼우면 결정문이 "문제 인식" 씬의 꼬리말로 묻히고 액션아이템이 사라진
# 자리에 "단계 1 / 보고서 참조" 필러가 들어간다(실측 run wr-20261101-083510-53a9).
# 골격이 장르를 모르면 조립은 성공하고 내용은 유실된다. 그래서 골격을 바꾼다.
id: delib-16x9
name_ko: 심의 결과 브리핑
stage: { w: 1920, h: 1080 }          # wide-16x9 와 같은 무대 — 템플릿·테마를 공유한다
# target 64 = 씬 6종 nat_default 합(9+8+11+8+14+14). 허용대는 심의 분량 편차를 받는 폭이다.
duration: { target: 64, min: 30, max: 180 }
skeleton: [topic, stakes, rounds, decision, action, summary]
template_pool:                       # 역할 → tpl id (fragmentize 의 section 어휘와 같은 이름)
  topic: [tpl.o-question]            # 화두를 답 없이 띄운다 — 예고 칩은 다루는 섹션
  stakes: [tpl.l-quote]              # 무엇이 걸려 있는가 — 화두 둘째 문장(득실). 70자 슬롯
  rounds: [tpl.concept]              # concept.rounds ← section="round" 조각 (코드·담당·요지)
  decision: [tpl.o-statement]        # 의사결정문 한 문장이 화면을 채운다
  action: [tpl.x-next]               # 결정 + 액션아이템. steps 의 when·owner 가 필수다
  summary: [tpl.x-summary]           # 수치를 가진 요지를 앞세운 되짚기 + 질의응답 대기
# 내레이션은 **보조**다 — 이 장르의 골든은 무음이고(format_review L-4·L-8), 시청 맥락이
# 혼자 보는 자료라 소리를 못 켜는 경우가 흔하다. 화면만으로 읽혀야 한다.
narration: { enabled: true, rate: 5.5 }
outputs: [video, pptx]
pptx: { slide_w_in: 13.333, slide_h_in: 7.5 }      # PowerPoint 표준 16:9
constraints: { min_font: 24, icon_font: 17, safe_margin: 140 }
theme: neutral-slate                 # 심의는 판단의 자리다 — 카메라 세기도 가장 낮다(0.8)

# ── 승격 루프 (PLAN §8.0) ──
# draft — 아직 심의를 거치지 않았다. 실측 표본 1건(아래 origin)으로 세운 초안이고,
# pilot 승격에는 완주 산출물과 format_review 판정이 필요하다.
status: active
usage_count: 2
origin:
  created: "2026-11-01"

presets:
  # 제작 심의(2026-11-01, 6인 20턴, Conditional-Go) 가 확정한 청중 파라미터 — C-6.
  # 청중이 비어 있으면(종전 "사내 청중") 용어 문턱 기준이 없어 적발 자체가 불가능하다.
  audience: "심의 비참여 결재선·인접 부서"
  tone: "판단 보고"
  viewing_context: "메일·메신저로 받아 혼자 보는 자료 (되감기 가능 — 밀도를 올려도 된다)"
  # ── TTS 실측 산물 (2026-11-07, 엔진 melo 속도 1.2, run wr-20261107-054449-46c4) ──
  # format_review 가 O-4 로 남긴 "64초는 실측이 아니다" 에 대한 답이다. 재 보니
  # **모자랐다** — 6씬 중 4씬이 낭독을 못 담았고(합계 -3.3초 추정), 실측 재조정으로
  # Σ64 → 72.3초가 됐다. duration.target 64 는 출발점으로 두고 dur_plan 이 지배한다
  # (wide-16x9 A2 와 같은 관계).
  dur_plan:
    topic: 12.1
    stakes: 8.3
    rounds: 13.3
    decision: 6.8
    action: 17.6
    summary: 14.2
  # 실측 무음 — 조정 뒤 씬당 0.82~0.86초로 고르고 선언만 2.37초(결정문이 한 문장이라
  # 짧다). 상한은 그 최대에 여유를 둔 값이다.
  narration: { rate: 5.5, max_silence: 2.4 }
  # 실측 자수 (최종본에서 실제로 쓰인 최대값 — 스키마 상한이 아니다)
  copy_guide:
    topic.question: 18
    topic.promise: 10
    topic.topics: 3
    stakes.quote: 35
    rounds.rounds.desc: 39
    decision.lines.text: 16
    action.decision.headline: 14
    action.decision.points: 17
    action.steps.what: 25
    summary.points.text: 30
  deliberation:
    type: design_review
    participants:
      - dir-creative-director     # CD — 쟁점 조직화·판정 집계
      - narr-story-architect      # ST — 골격·핵심 메시지 (scenario_patch 독점 작성권)
      - impl-technical-director   # TD — 엔진 계약·조립 경로
      - qa-consistency            # QA — 레지스트리 대조·회귀·게이트 리포트
      - ux-accessibility          # AX — 대비·자수·모션 (조건부 거부권)
      - ux-audience-advocate      # AU — 청중·인지 부하·기억 잔존
    agenda:
      - "골격이 심의의 논증을 다 담는가 — 쟁점·근거의 자리가 있는가"
      - "조립이 원문을 버리지 않는가 — 결정값·근거·담당이 화면까지 오는가"
      - "선언한 것이 적용되는가 — 테마·청중·톤이 명세에서 산출까지 닿는가"

# 골든 — 제작 심의 조건 C-3 의 순서대로 ①테마 수정 ②재빌드 ③게이트 재실행을 거친
# 산출물이다. 그 앞의 wr-20261101-095212-e8ed 은 테마가 틀린 화면이라 골든이 될 수 없다
# (TD: "골든은 회귀선이지 기록물이 아니다").
golden:
  run_id: wr-20261101-122319-7de1
  artifacts:
    - data/renders/delib-golden-7de1/video.mp4
    - data/renders/delib-golden-7de1/slides.pptx
    - data/pipeline/wr-20261101-122319-7de1/scenario.json
  qa_report: data/qa_reports/20261101-122558-0fcb66/qa.json

# 승격 이력 — 회의록은 data/(gitignore) 라 다른 사람 손에 없다. 근거를 여기 남긴다.
promotions:
  - to: pilot
    meeting_id: 9f6226ac-b06a-4fad-8d05-87f2de36815d
    verdict: Conditional-Go
    date: "2026-11-01"
    note: >-
      제작 심의 6인(CD·ST·TD·QA·AX·AU) 20턴. 엔진 계약 위반 0, AX 거부권 미행사,
      QA 조건부 보류. Go 가 아닌 이유는 **선언한 테마가 적용되지 않아 이 포맷의 색을
      심의하지 못했기** 때문이다(QA 가 게이트 info 1건을 단서로 빌드 대조해 찾았다).
      조건 C-1~C-7 중 C-5 의 '결정 씬에 근거 문장' 만 스키마 상한으로 불가하여 교훈으로
      접었고, 나머지 6건은 전부 이행했다.
  - to: active
    meeting_id: 3efabdb0-7b91-41a4-b4da-699fdce82f88
    verdict: Go
    date: "2026-11-01"
    note: >-
      포맷 승격 심사 6인 20턴, 전원 찬성·반대 0. 유일한 실질 쟁점이던 F-TD-3(골든에
      내레이션 없음)은 TD 본인이 내렸다 — 내레이션은 scenario.json 에서 파생되므로
