<!DOCTYPE html>
<!-- WebDesignAgents 웹 콘솔 — 무번들러 정적 SPA (상대경로 fetch 로 서브패스 프록시 대응) -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WebDesignAgents 콘솔</title>
<!-- 폐쇄망에서 렌더 블로킹 방지 — 비동기 로드, 실패 시 시스템 폰트 폴백 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" media="print" onload="this.media='all'">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="brand-mark">WD</span>
    <div>
      <div class="brand-name">WebDesignAgents</div>
      <div class="brand-sub">전문가 심의 기반 발표자료 자동 생성</div>
    </div>
  </div>
  <div class="health" id="health">
    <span class="health-dot" id="health-dot"></span>
    <span id="health-text">확인 중…</span>
  </div>
</header>

<nav class="tabs" id="tabs">
  <button class="tab active" data-tab="create">생성</button>
  <button class="tab" data-tab="history">실행 이력</button>
  <button class="tab" data-tab="modules">모듈 갤러리</button>
  <button class="tab" data-tab="meetings">회의록</button>
</nav>

<main>
  <!-- ① 생성 -->
  <section class="panel active" id="panel-create">
    <div class="create-grid">
      <div class="card">
        <h2>보고서 입력</h2>
        <p class="hint">ReportArchive 보고서 JSON(report_archive_draft_v1)을 붙여넣거나 파일을 선택하세요.</p>
        <textarea id="report-json" spellcheck="false" placeholder='{"_type": "report_archive_draft_v1", ...}'></textarea>
        <div class="form-row">
          <label class="file-label">
            <input type="file" id="report-file" accept=".json,application/json">
            <span id="file-name">파일 선택…</span>
          </label>
          <input type="text" id="slug-input" placeholder="슬러그 (선택)">
          <button class="btn primary" id="run-btn">파이프라인 실행</button>
        </div>
        <div class="form-error" id="create-error"></div>
      </div>

      <div class="card" id="run-detail" hidden>
        <div class="run-head">
          <h2 id="run-title">실행</h2>
          <span class="badge" id="run-status"></span>
        </div>
        <ol class="stages" id="run-stages"></ol>
        <div class="summary" id="run-summary" hidden></div>
        <div class="form-error" id="run-error"></div>

        <div class="actions" id="run-actions" hidden>
          <button class="btn" id="render-btn">렌더 (mp4 + pptx)</button>
          <button class="btn" id="qa-btn">QA 게이트 실행</button>
          <span class="action-note" id="render-status"></span>
        </div>
        <div class="downloads" id="run-downloads"></div>
        <div class="qa-result" id="qa-result" hidden></div>

        <div class="preview-wrap" id="preview-wrap" hidden>
          <div class="preview-split">
            <div class="preview-left">
              <h3>프리뷰</h3>
              <div class="frame-box"><iframe id="preview-frame" title="렌더 프리뷰"></iframe></div>
            </div>
            <div class="chat-panel" id="chat-panel">
              <h3>대화형 제작</h3>
              <div class="chat-messages" id="chat-messages"></div>
              <div class="chat-input-row">
                <input type="text" id="chat-input" placeholder='예: "절차 씬 길이를 14초로 줄여줘"'>
                <button class="btn primary" id="chat-send">전송</button>
              </div>
              <div class="form-error" id="chat-error"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- ② 실행 이력 -->
  <section class="panel" id="panel-history">
    <div class="panel-head">
      <h2>실행 이력</h2>
      <button class="btn" id="history-refresh">새로고침</button>
    </div>
    <div id="history-list" class="list"></div>
  </section>

  <!-- ③ 모듈 갤러리 -->
  <section class="panel" id="panel-modules">
    <div class="panel-head">
      <h2>모듈 갤러리</h2>
      <span class="hint" id="modules-meta"></span>
    </div>
    <div id="modules-grid" class="module-grid"></div>
    <div class="preview-wrap" id="module-preview-wrap" hidden>
      <h3 id="module-preview-title">모듈 프리뷰</h3>
      <div class="frame-box"><iframe id="module-preview-frame" title="모듈 프리뷰"></iframe></div>
    </div>
  </section>

  <!-- ④ 회의록 -->
  <section class="panel" id="panel-meetings">
    <div class="meetings-grid">
      <div class="card">
        <div class="panel-head">
          <h2>회의 목록</h2>
          <button class="btn" id="meetings-refresh">새로고침</button>
        </div>
        <div id="meetings-list" class="list"></div>
      </div>
      <div class="card">
        <h2 id="minutes-title">회의록</h2>
        <pre id="minutes-body" class="minutes">왼쪽에서 회의를 선택하세요.</pre>
      </div>
    </div>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
