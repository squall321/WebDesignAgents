[project]
name = "webdesignagents"
version = "0.1.0"
description = "전문가 심의 기반 발표자료(영상/PPT) 자동 생성 플랫폼"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings",
    "structlog",
    "PyYAML",
    "typer",
    "httpx",
    "jsonschema",
]

[project.optional-dependencies]
# 상한 필수 — mcp 2.0 이 mcp.server.fastmcp 를 제거했다(FastMCP 는 별도 fastmcp 패키지로 이관).
# 상한이 없던 동안 SIF 빌드가 2.0.0 을 잡아 wdmcp/server.py 의 import 가 깨졌고, uvicorn 이
# 앱 로드에 실패해 기동 즉시 죽었다. 겉으로는 앱 경로가 정적 HTML 200 을 돌려줘 살아 있는
# 것처럼 보였고, 게이트웨이에는 도구 0개 백엔드로 붙어 있었다(2026-08-03 ~ 08-08).
mcp = ["mcp>=1.0,<2"]
llm = ["openai>=1.0"]
render = ["playwright", "python-pptx", "pillow", "numpy", "python-docx", "pypdf"]
web = ["fastapi>=0.110", "uvicorn>=0.30", "python-multipart"]
dev = ["pytest", "pytest-asyncio"]

[project.scripts]
wdmcp = "wdmcp.server:main"
wda = "wdpipeline.cli:app"
wdweb = "wdweb.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wdcore", "src/wdmcp", "src/wdllm", "src/wdpipeline", "src/wdrender", "src/wdqa", "src/wdweb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
